name: Update mod source

# After a successful "Cut Mod Release", list the new version in mod-source.json so the
# OpenGOAL launcher offers it (new installs and updates).
on:
  workflow_run:
    workflows: ["Cut Mod Release ⭐"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add the latest release to mod-source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_KEY: true-flight
          MOD_GAME: jak3
        run: python3 .github/scripts/add_release_to_mod_source.py
      - name: Commit
        run: |
          if git diff --quiet mod-source.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mod source: add the latest release" mod-source.json
          git push
